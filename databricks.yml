bundle:
  name: netezza-exporter

# -----------------------------------------------------------------------------------------------------------
# Variáveis: tudo o que muda por ambiente. Preencha nos targets (ou via BUNDLE_VAR_<nome> no CI/CD).
# -----------------------------------------------------------------------------------------------------------
variables:
  app_name:
    description: Nome do Databricks App (único no workspace)
    default: netezza-exporter
  lakebase_project:
    description: ID do projeto Lakebase (Postgres) que guarda pedidos, subblocos e configuração do app
    default: netezza-exporter
  lakebase_endpoint:
    description: Endpoint read-write do branch production do projeto Lakebase
    default: projects/netezza-exporter/branches/production/endpoints/primary
  secret_scope:
    description: Secret scope já existente no ambiente com host, porta, usuário e senha do Netezza (app e jobs só leem). Nunca coloque o valor aqui.
    default: nzexport-netezza
  dest_catalogs:
    description: Catálogos de destino (vírgula) em que o app recebe BROWSE para o navegador do catálogo
    default: ""
  serverless_policy_id:
    description: ID da política de serverless (budget policy) aplicada ao app. Vazio = política padrão do workspace.
    default: ""
  svc_hash:
    description: Application ID do service principal que roda os jobs (run_as) e lê o secret scope. Obrigatório em hml/prd.
    default: ""

sync:
  exclude:
    - .venv
    - "**/__pycache__"
    - tests
    - "*.md"
    - .claude-sessions.log
    - scripts/ref_*
    - scripts/screenshots

resources:
  # ---------------------------------------------------------------------------------------------------------
  # Estado do app (Lakebase). prevent_destroy: um `bundle destroy` não apaga os dados da migração.
  # ---------------------------------------------------------------------------------------------------------
  postgres_projects:
    nzexport_lakebase:
      project_id: ${var.lakebase_project}
      display_name: Netezza Exporter
      pg_version: 17
      lifecycle:
        prevent_destroy: true

  # O secret scope do Netezza (var.secret_scope) já existe no ambiente e não é recurso do bundle: o app e os jobs
  # só leem host, porta, usuário e senha. Quem administra o scope grava os valores e dá READ ao app e aos jobs.

  jobs:
    nzexport_dispatcher:
      name: nzexport-dispatcher
      description: Drena a fila de subblocos e chama a SP_CARGA_EVENTUAL no Netezza.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: idle_exit_s
          default: "120"
        - name: max_runtime_min
          default: "720"
      tasks:
        - task_key: dispatcher
          environment_key: default
          spark_python_task:
            python_file: ./src/run_dispatcher.py
            parameters:
              - --endpoint
              - "{{job.parameters.lakebase_endpoint}}"
              - --run-id
              - "{{job.run_id}}"
              - --job-id
              - "{{job.id}}"
              - --idle-exit-s
              - "{{job.parameters.idle_exit_s}}"
              - --max-runtime-min
              - "{{job.parameters.max_runtime_min}}"
              - --importer-job-id
              - "${resources.jobs.nzexport_importer.id}"
          timeout_seconds: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: &deps
              - nzpy>=1.15
              - psycopg[binary]>=3.2
              - psycopg-pool>=3.2
              - databricks-sdk>=0.81

    nzexport_importer:
      name: nzexport-importer
      description: Importa o .dat de cada subbloco exportado na tabela destino (Delta), apaga o arquivo; em erro limpa o período e move o .dat para a pasta de erro.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: idle_exit_s
          default: "120"
        - name: max_runtime_min
          default: "720"
      tasks:
        - task_key: importar
          environment_key: default
          notebook_task:
            notebook_path: ./src/importar_dat.py
            base_parameters:
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              run_id: "{{job.run_id}}"
              idle_exit_s: "{{job.parameters.idle_exit_s}}"
              max_runtime_min: "{{job.parameters.max_runtime_min}}"
          timeout_seconds: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: *deps

    nzexport_conn_test:
      name: nzexport-conn-test
      description: Testa a conexão Netezza configurada no app (mesmo caminho de rede do dispatcher).
      max_concurrent_runs: 5
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: source_id
          default: ""
        - name: test_id
          default: ""
      tasks:
        - task_key: test
          environment_key: default
          spark_python_task:
            python_file: ./src/run_conn_test.py
            parameters: ["--endpoint", "{{job.parameters.lakebase_endpoint}}", "--source-id", "{{job.parameters.source_id}}",
                         "--test-id", "{{job.parameters.test_id}}", "--run-id", "{{job.run_id}}"]
          timeout_seconds: 600
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: *deps

    # Pós-deploy idempotente: rode depois de TODO deploy (bundle run nzexport_pos_deploy).
    nzexport_pos_deploy:
      name: nzexport-pos-deploy
      description: Migra o banco do app, aplica grants/ACLs ao service principal do app e confere os pré-requisitos.
      max_concurrent_runs: 1
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: app_name
          default: ${var.app_name}
        - name: secret_scope
          default: ${var.secret_scope}
        - name: dest_catalogs
          default: ${var.dest_catalogs}
      tasks:
        - task_key: pos_deploy
          environment_key: default
          spark_python_task:
            python_file: ./src/pos_deploy.py
            parameters: ["--endpoint", "{{job.parameters.lakebase_endpoint}}", "--app-name", "{{job.parameters.app_name}}",
                         "--secret-scope", "{{job.parameters.secret_scope}}", "--dest-catalogs", "{{job.parameters.dest_catalogs}}",
                         "--run-id", "{{job.run_id}}"]
          timeout_seconds: 1800
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: *deps

  apps:
    nzexport_app:
      name: ${var.app_name}
      description: Migração Netezza → Databricks — pedidos por subbloco, importação para Delta e completude
      source_code_path: ./src
      budget_policy_id: ${var.serverless_policy_id}
      config:
        command: ["gunicorn", "app:app", "-w", "2", "--threads", "8", "-b", "0.0.0.0:8000", "--timeout", "120"]
        env:
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: NETEZZA_SECRET_SCOPE
            value: ${var.secret_scope}
          - name: DISPATCHER_JOB_ID
            value_from: dispatcher-job
          - name: CONN_TEST_JOB_ID
            value_from: conn-test-job
          - name: IMPORTER_JOB_ID
            value_from: importer-job
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.nzexport_lakebase.name}/branches/production
            database: ${resources.postgres_projects.nzexport_lakebase.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: dispatcher-job
          job:
            id: ${resources.jobs.nzexport_dispatcher.id}
            permission: CAN_MANAGE_RUN
        - name: conn-test-job
          job:
            id: ${resources.jobs.nzexport_conn_test.id}
            permission: CAN_MANAGE_RUN
        - name: importer-job
          job:
            id: ${resources.jobs.nzexport_importer.id}
            permission: CAN_MANAGE_RUN

# -----------------------------------------------------------------------------------------------------------
# Ambientes. dev = workspace de desenvolvimento (jobs rodam como quem faz o deploy).
# hml/prd = ambiente do cliente: preencha o host e as variáveis <...>; jobs rodam como o service principal
# (svc_hash) e o bundle fica na pasta dele, como no PLHDWA.
# -----------------------------------------------------------------------------------------------------------
targets:
  dev:
    default: true
    workspace:
      host: https://fevm-stable-classic-pg4xe1.cloud.databricks.com
    variables:
      dest_catalogs: stable_classic_pg4xe1_catalog

  hml:
    workspace:
      host: https://<workspace-hml>.cloud.databricks.com
      root_path: /Workspace/Users/${var.svc_hash}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.svc_hash}
    variables:
      app_name: netezza-exporter-hml
      lakebase_project: netezza-exporter-hml
      lakebase_endpoint: projects/netezza-exporter-hml/branches/production/endpoints/primary
      secret_scope: nzexport-netezza-hml
      dest_catalogs: <catalogo_destino_hml>
      svc_hash: <application_id_do_sp_hml>
      serverless_policy_id: <id_da_politica_serverless_hml>

  prd:
    workspace:
      host: https://<workspace-prd>.cloud.databricks.com
      root_path: /Workspace/Users/${var.svc_hash}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.svc_hash}
    variables:
      app_name: netezza-exporter
      lakebase_project: netezza-exporter-prd
      lakebase_endpoint: projects/netezza-exporter-prd/branches/production/endpoints/primary
      secret_scope: nzexport-netezza
      dest_catalogs: <catalogo_destino_prd>
      svc_hash: <application_id_do_sp_prd>
      serverless_policy_id: <id_da_politica_serverless_prd>
