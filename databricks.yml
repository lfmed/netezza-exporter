bundle:
  name: netezza-exporter

variables:
  lakebase_project:
    default: netezza-exporter
  lakebase_endpoint:
    default: projects/netezza-exporter/branches/production/endpoints/primary
  app_sp_client_id:
    description: client id do service principal do app (recebe GRANT no schema nzexport)
    default: "88d6e7b2-9da3-4ca1-890e-fab9e0eb9604"

sync:
  exclude:
    - .venv
    - "**/__pycache__"
    - tests
    - "*.md"
    - .claude-sessions.log

resources:
  jobs:
    nzexport_dispatcher:
      name: nzexport-dispatcher
      description: Drena a fila de subblocos e chama a procedure Netezza (tabela, data_ini, data_fim).
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: grant_role
          default: ${var.app_sp_client_id}
        - name: idle_exit_s
          default: "120"
        - name: max_runtime_min
          default: "720"
      tasks:
        - task_key: dispatcher
          environment_key: default
          spark_python_task:
            python_file: ./src/run_dispatcher.py
            parameters:
              - --endpoint
              - "{{job.parameters.lakebase_endpoint}}"
              - --run-id
              - "{{job.run_id}}"
              - --job-id
              - "{{job.id}}"
              - --idle-exit-s
              - "{{job.parameters.idle_exit_s}}"
              - --max-runtime-min
              - "{{job.parameters.max_runtime_min}}"
              - --grant-role
              - "{{job.parameters.grant_role}}"
              - --importer-job-id
              - "${resources.jobs.nzexport_importer.id}"
          timeout_seconds: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - nzpy>=1.15
              - psycopg[binary]>=3.2
              - psycopg-pool>=3.2
              - databricks-sdk>=0.81

    nzexport_importer:
      name: nzexport-importer
      description: Importa o .dat de cada subbloco exportado na tabela destino (Delta), apaga o arquivo; em erro limpa o período e move o .dat para a pasta de erro.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: idle_exit_s
          default: "120"
        - name: max_runtime_min
          default: "720"
      tasks:
        - task_key: importar
          environment_key: default
          notebook_task:
            notebook_path: ./src/importar_dat.py
            base_parameters:
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              run_id: "{{job.run_id}}"
              idle_exit_s: "{{job.parameters.idle_exit_s}}"
              max_runtime_min: "{{job.parameters.max_runtime_min}}"
          timeout_seconds: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - psycopg[binary]>=3.2
              - psycopg-pool>=3.2
              - databricks-sdk>=0.81

    nzexport_conn_test:
      name: nzexport-conn-test
      description: Testa a conexão Netezza configurada no app (mesmo caminho de rede do dispatcher).
      max_concurrent_runs: 5
      parameters:
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: source_id
          default: ""
        - name: test_id
          default: ""
      tasks:
        - task_key: test
          environment_key: default
          spark_python_task:
            python_file: ./src/run_conn_test.py
            parameters: ["--endpoint", "{{job.parameters.lakebase_endpoint}}", "--source-id", "{{job.parameters.source_id}}",
                         "--test-id", "{{job.parameters.test_id}}", "--run-id", "{{job.run_id}}"]
          timeout_seconds: 600
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - nzpy>=1.15
              - psycopg[binary]>=3.2
              - psycopg-pool>=3.2
              - databricks-sdk>=0.81

  apps:
    nzexport_app:
      name: netezza-exporter
      description: Exportador Netezza — pedidos, subblocos, acompanhamento e periodicidade
      source_code_path: ./src
      resources:
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: dispatcher-job
          job:
            id: ${resources.jobs.nzexport_dispatcher.id}
            permission: CAN_MANAGE_RUN
        - name: conn-test-job
          job:
            id: ${resources.jobs.nzexport_conn_test.id}
            permission: CAN_MANAGE_RUN
        - name: importer-job
          job:
            id: ${resources.jobs.nzexport_importer.id}
            permission: CAN_MANAGE_RUN

targets:
  dev:
    default: true
    workspace:
      host: https://fevm-stable-classic-pg4xe1.cloud.databricks.com
