<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exportador Netezza{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}"><span class="logo">NZ</span> Exportador Netezza</a>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Painel</a>
    <a href="{{ url_for('requests_list') }}" class="{{ 'on' if request.endpoint in ('requests_list', 'request_detail') }}">Pedidos</a>
    <a href="{{ url_for('request_new') }}" class="{{ 'on' if request.endpoint in ('request_new', 'request_review') }}">Novo pedido</a>
    <a href="{{ url_for('admin') }}" class="{{ 'on' if request.endpoint and request.endpoint.startswith('admin') }}">Administração</a>
  </nav>
  <span class="user">{{ current_user }}</span>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
